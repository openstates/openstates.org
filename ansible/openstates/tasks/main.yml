# uwsgi (installed in the virtualenv from the "deploy" dependency group, so
# it's always built against the app's Python)
- name: make uwsgi log dir
  file:
    path: /var/log/uwsgi/app
    state: directory
    owner: openstates
    group: openstates

- name: rotate uwsgi log
  copy:
    src: files/logrotate-uwsgi
    dest: /etc/logrotate.d/openstates-uwsgi
    mode: 0644

- name: write uwsgi template
  template:
    src: uwsgi.j2
    dest: /home/openstates/uwsgi.ini
    owner: openstates
    group: openstates
    mode: 0600
  notify:
    - restart django-application

- name: write uwsgi systemd unit
  copy:
    src: files/openstates-uwsgi.service
    dest: /etc/systemd/system/openstates-uwsgi.service
    mode: 0644
  notify:
    - restart django-application

# Earlier deploys ran the app under Debian's uwsgi package with a
# separately built Python plugin; remove it so it doesn't hold the socket.
- name: remove distro uwsgi
  apt:
    pkg:
      - uwsgi
      - uwsgi-core
      - uwsgi-src
    state: absent
    purge: yes

- name: start uwsgi
  systemd:
    name: openstates-uwsgi
    state: started
    enabled: yes
    daemon_reload: yes
