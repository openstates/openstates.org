name: Build and push Docker images
on:
  push:
    branches:
      - develop
    tags:
      - '*'
permissions:
  contents: read
jobs:
  publish:
    steps:
      - uses: actions/checkout@v7
      - name: log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build cron docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/cron/Dockerfile
          tags: openstates/openstates.org:tasks
          push: true
      - name: build main docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/uwsgi/Dockerfile
          # the git ref tag matches the old build-push-action@v1 tag_with_ref behavior
          tags: "openstates/openstates.org:latest,openstates/openstates.org:django-dev,openstates/openstates.org:${{ github.ref_name }}"
          push: true
    runs-on: ubuntu-latest
  publish-plural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: civic-eagle-enview-prod
          credentials_json: "${{ secrets.PLURAL_OPEN_REPO_PUSHER_KEY }}"
      - name: Setup Google Cloud SDK
        uses: "google-github-actions/setup-gcloud@v3"
      - name: Docker Auth
        run: |-
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Build and Push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/uwsgi/Dockerfile
          tags: "us-central1-docker.pkg.dev/civic-eagle-enview-prod/open-containers/openstates.org:latest,us-central1-docker.pkg.dev/civic-eagle-enview-prod/open-containers/openstates.org:${{ github.sha }}"
          push: true
