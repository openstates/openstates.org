name: Test Python & JavaScript

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DATABASE: test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: check out code
        uses: actions/checkout@v3
      # Python dependencies (Python version comes from .python-version)
      - name: install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - name: install python dependencies
        run: uv sync --locked

      - name: lint with ruff
        run: uv run inv lint

      # node dependencies
      - name: setup Node 12
        uses: actions/setup-node@v1
        with:
          node-version: '12'
      - name: cache node_modules
        uses: actions/cache@v3
        id: node-cache
        with:
          path: ./node_modules
          key: node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-${{ hashFiles('**/package-lock.json') }}
      - name: install node packages
        run: npm install && npm run build
      - name: pytest
        run: uv run inv test --no-docker-db
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
