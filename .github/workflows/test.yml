name: Test Python & JavaScript

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DATABASE: test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: check out code
        uses: actions/checkout@v7
      - name: install GDAL and GEOS (needed by django.contrib.gis)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgdal-dev libgeos-dev
      # Python dependencies (Python version comes from .python-version)
      - name: install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - name: install python dependencies
        run: uv sync --locked

      - name: lint with ruff
        run: uv run inv lint

      # node dependencies (same Node major as docker/uwsgi/Dockerfile)
      - name: setup Node 16
        uses: actions/setup-node@v7
        with:
          node-version: '16'
          cache: npm
      - name: install node packages
        run: npm ci && npm run build
      - name: pytest
        run: uv run inv test --no-docker-db
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
